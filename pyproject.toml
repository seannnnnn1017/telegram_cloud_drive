[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-cloud-drive"
version = "0.1.0"
description = "Personal LAN cloud drive backed by Telegram Bot API storage."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "httpx==0.27.2",
    "aiosqlite==0.20.0",
    "python-multipart==0.0.9",
    "python-dotenv==1.0.1",
    "pydantic==2.8.2",
    "telethon==1.36.0",
]

[project.optional-dependencies]
test = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "pytest-httpx==0.32.0",
]

[project.scripts]
telecloud = "backend.cli:main"

[tool.setuptools]
packages = ["backend"]
